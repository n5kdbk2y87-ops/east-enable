<!DOCTYPE html>
<html>
<head>
  <title>East Enable - Home</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #ffffff; /* white background */
      color: #0a1f44; /* dark blue text */
      opacity: 0;
      transition: opacity 0.6s ease-in-out;
    }
    body.fade-in { opacity: 1; }
    .home-container {
      max-width: 900px;
      margin: 50px auto;
      padding: 40px;
      background-color: #f2f6ff; /* very light blue section */
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      text-align: center;
    }
    h1 { color: #0a1f44; }
    h2 { color: #0059b3; margin-top: 30px; }
    p { line-height: 1.6; }
    a.button {
      display: inline-block;
      background-color: #0059b3; /* dark blue button */
      color: white;
      padding: 12px 20px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      transition: background-color 0.3s;
      margin: 10px;
    }
    a.button:hover { background-color: #004080; }
  </style>
</head>
<body>
  <div class="home-container">
    <h1>Welcome to East Enable</h1>
    <p>We are a creative agency based in Tema, Ghana, specializing in web design, branding, and digital marketing.</p>
    
    <h2>About East Enable</h2>
    <p>East Enable was founded with a simple vision: to help businesses shine online.</p>
    <p>Explore our <a href="about.html" class="button">About Us</a>, <a href="services.html" class="button">Services</a>, or <a href="contact.html" class="button">Contact Us</a>.</p>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => { document.body.classList.add("fade-in"); });
    window.addEventListener("pageshow", (event) => { if (event.persisted) { document.body.classList.add("fade-in"); } });
    document.querySelectorAll("a").forEach(link => {
      link.addEventListener("click", e => {
        const href = link.getAttribute("href");
        if (href && !href.startsWith("#")) {
          e.preventDefault();
          document.body.classList.remove("fade-in");
          setTimeout(() => { window.location.href = href; }, 600);
        }
      });
    });
  </script>
</body>
</html>
