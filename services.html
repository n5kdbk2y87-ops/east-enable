<!DOCTYPE html>
<html>
<head>
  <title>Our Services - East Enable</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background-color: #fff; opacity: 0; transition: opacity 0.6s ease-in-out; }
    body.fade-in { opacity: 1; }
    .services-container { max-width: 900px; margin: 50px auto; padding: 30px; }
    h1 { text-align: center; color: #a0522d; margin-bottom: 30px; }
    .service-card {
      background-color: #fdf6f0;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      padding: 20px;
      margin-bottom: 20px;
    }
    .service-card h2 { color: #8b4513; margin-bottom: 10px; }
    .service-card p { color: #333; line-height: 1.6; margin-bottom: 15px; }
    a.button {
      display: inline-block;
      background-color: #a0522d;
      color: white;
      padding: 10px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      transition: background-color 0.3s;
    }
    a.button:hover { background-color: #8b4513; }
  </style>
</head>
<body>
  <div class="services-container">
    <h1>Our Services</h1>
    <div class="service-card">
      <h2>🌐 Web Design</h2>
      <p>Responsive, modern websites tailored to your brand.</p>
      <a href="contact.html" class="button">Learn More</a>
    </div>
    <div class="service-card">
      <h2>🎨 Branding</h2>
      <p>Logo design, color palettes, and brand identity systems.</p>
      <a href="contact.html" class="button">Learn More</a>
    </div>
    <div class="service-card">
      <h2>📈 Digital Marketing</h2>
      <p>SEO, social media campaigns, and online growth strategies.</p>
      <a href="contact.html" class="button">Learn More</a>
    </div>
    <a href="index.html" class="button">Return to Home Page</a>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.body.classList.add("fade-in");
    });
    document.querySelectorAll("a").forEach(link => {
      link.addEventListener("click", e => {
        const href = link.getAttribute("href");
        if (href && !href.startsWith("#")) {
          e.preventDefault();
          document.body.classList.remove("fade-in");
          setTimeout(() => { window.location.href = href; }, 600);
        }
      });
    });
  </script>
</body>
</html>
