<!DOCTYPE html>
<html>
<head>
  <title>Services - East Enable</title>
  <style>
    body { margin:0; font-family:Arial; background:#ffffff; color:#0a1f44; opacity:0; transition:opacity 0.6s; }
    body.fade-in { opacity:1; }
    .services-container { max-width:800px; margin:50px auto; padding:30px; background:#f2f6ff; border-radius:8px; text-align:center; }
    h1 { color:#0a1f44; }
    p { line-height:1.6; }
    a.button { background:#0059b3; color:white; padding:12px 20px; border-radius:6px; text-decoration:none; font-weight:bold; margin:10px; display:inline-block; }
    a.button:hover { background:#004080; }
  </style>
</head>
<body>
  <div class="services-container">
    <h1>Our Services</h1>
    <p>We offer web design, branding, and digital marketing tailored to your business goals.</p>
    <a href="index.html" class="button">Home</a>
    <a href="about.html" class="button">About</a>
    <a href="contact.html" class="button">Contact</a>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => { document.body.classList.add("fade-in"); });
    window.addEventListener("pageshow", (event) => { if (event.persisted) { document.body.classList.add("fade-in"); } });
    document.querySelectorAll("a").forEach(link => {
      link.addEventListener("click", e => {
        const href = link.getAttribute("href");
        if (href && !href.startsWith("#")) {
          e.preventDefault();
          document.body.classList.remove("fade-in");
          setTimeout(() => { window.location.href = href; }, 600);
        }
      });
    });
  </script>
</body>
</html>
