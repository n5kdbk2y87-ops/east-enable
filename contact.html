<!DOCTYPE html>
<html>
<head>
  <title>Contact Us - East Enable</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background-color: #0a1f44; color: #e6f0ff; opacity: 0; transition: opacity 0.6s ease-in-out; }
    body.fade-in { opacity: 1; }
    .contact-container {
      max-width: 700px;
      margin: 50px auto;
      padding: 30px;
      background-color: #132d66;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      text-align: center;
    }
    h1 { color: #66b2ff; margin-bottom: 20px; }
    p { line-height: 1.6; margin-bottom: 15px; }
    a.button {
      display: inline-block;
      background-color: #0059b3;
      color: white;
      padding: 12px 20px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      transition: background-color 0.3s;
      margin: 10px;
    }
    a.button:hover { background-color: #004080; }
  </style>
</head>
<body>
  <div class="contact-container">
    <h1>Contact Us</h1>
    <p>We’d love to hear from you! Use the buttons below to reach us instantly.</p>
    <a href="tel:+233XXXXXXXXX" class="button">📞 Call Us Now</a>
    <a href="mailto:info@eastenable.com" class="button">✉️ Email Us</a>
    <p>Or explore more on our <a href="about.html" class="button">About</a> and <a href="services.html" class="button">Services</a> pages.</p>
    <p>Location: Tema, Greater Accra, Ghana</p>
    <a href="index.html" class="button">Return to Home Page</a>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.body.classList.add("fade-in");
    });
    document.querySelectorAll("a").forEach(link => {
      link.addEventListener("click", e => {
        const href = link.getAttribute("href");
        if (href && !href.startsWith("#")) {
          e.preventDefault();
          document.body.classList.remove("fade-in");
          setTimeout(() => { window.location.href = href; }, 600);
        }
      });
    });
  </script>
</body>
</html>
